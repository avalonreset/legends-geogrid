name: Bug report
description: Report a reproducible defect in legends-geogrid
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue and the exact command run.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and runtime version
      placeholder: "Windows 11 / macOS / Ubuntu, Python 3.12"
    validations:
      required: true
